syntax = "prpto3";

package streamvault.content;

option java_package = "com.streamvault.proto.content";
option java_outer_classname = "ContentProto";
option java_multiple_files = true;

service ContentGrpcService {
  rpc GetContentById (GetContentByIdRequest) returns (ContentResponse);
  rpc ListContent (ListContentRequest) returns (ListContentResponse);
  rpc SearchContent (SearchContentRequest) returns (ListContentResponse);
}

message GetContentByIdRequest {
  string content_id = 1;
}

message ContentResponse {
  string content_id = 1;
  string title = 2;
  string description = 3;
  string genre = 4;
  string type = 5;
  float rating = 6;
  int32 release_year = 7;
  string thumbnail_url = 8;
  bool found = 9;
}

message ListContentRequest {
  int32 page = 1;
  int32 size = 2;
  string genre = 3;
}

message SearchContentRequest {
  string query = 1;
  int32 page = 2;
  int32 size = 3;
}

message ListContentResponse {
  repeated ContentResponse content = 1;
  int32 total = 2;
}